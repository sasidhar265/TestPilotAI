printWidth: 100
tabWidth: 2
useTabs: false
semi: true
singleQuote: false
trailingComma: all
proseWrap: preserve
htmlWhitespaceSensitivity: css
embeddedLanguageFormatting: "off"
endOfLine: lf
overrides:
  - files: "**/*.Json"
    options:
      parser: json
  - files: "**/*.svg"
    options:
      parser: html
