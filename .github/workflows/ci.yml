name: Validate AI agent

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade 'pip>=26.2' 'setuptools>=83'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check app tests
      - name: Format policy
        run: ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Dependency vulnerability audit
        run: pip-audit .
      - name: Test and coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Compile
        run: python -m compileall -q app tests
      - name: Verify sole AI runtime policy
        run: >-
          ! grep -RniE 'OpenAIGenerator|OllamaGenerator|AnthropicGenerator|BedrockGenerator'
          app
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
