name: Validate AI agent

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade 'pip>=26.2' 'setuptools>=83'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check app tests
      - name: Format policy
        run: ruff format --check app tests
      - name: Type check
        run: mypy app
      - name: Dependency vulnerability audit
        run: pip-audit .
      - name: Test and coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Compile
        run: python -m compileall -q app tests
      - name: Verify sole AI runtime policy
        run: >-
          ! grep -RniE 'OpenAIGenerator|OllamaGenerator|AnthropicGenerator|BedrockGenerator'
          app
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  container:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable application image
        run: docker build --tag story-to-tests-agent:${{ github.sha }} .
      - name: Start container
        run: >-
          docker run --detach --name story-to-tests-smoke
          --publish 127.0.0.1:8000:8000
          story-to-tests-agent:${{ github.sha }}
      - name: Verify container readiness
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs story-to-tests-smoke
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force story-to-tests-smoke || true
