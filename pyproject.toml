[project]
name = "quality-lifecycle-studio"
version = "0.1.0"
description = "Governed agentic test design from requirements to accepted quality artifacts."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Proprietary"}
authors = [{name = "Quality Engineering"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "github-copilot-sdk>=1.0.11,<2",
  "pydantic-settings>=2.14.2,<3",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pillow>=12.3,<13",
  "pypdf>=6.15,<7",
  "pytesseract>=0.3.13,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/dependencies.py" = ["B008"]
"app/main.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["tools/"]

[tool.setuptools.package-data]
app = ["py.typed"]
